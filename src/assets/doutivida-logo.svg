<svg viewBox="0 0 760 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;display=swap');
      .font-doutivida {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- ================= SÍMBOLO: ESTETOSCÓPIO / "D" ================= -->
  <g id="simbolo-doutivida">
    <!-- Arco Superior/Externo em forma de "D" (Azul Escuro #073D70) -->
    <path 
      d="M 132 54 
         C 145 54, 218 52, 218 108 
         C 218 158, 168 152, 153 148" 
      stroke="#073D70" 
      stroke-width="22" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Hastes Superiores do Estetoscópio (Azul Claro #4099D0) -->
    <!-- Haste Esquerda -->
    <path 
      d="M 95 72 
         C 80 94, 82 125, 102 143 
         C 114 154, 126 156, 126 160" 
      stroke="#4099D0" 
      stroke-width="11" 
      stroke-linecap="round" 
      fill="none" 
    />
    <!-- Oliva Auricular Esquerda (Azul Escuro #073D70) -->
    <circle cx="95" cy="71" r="7.5" fill="#073D70" />

    <!-- Haste Direita -->
    <path 
      d="M 137 68 
         C 148 82, 149 110, 141 133 
         C 134 148, 126 155, 126 160" 
      stroke="#4099D0" 
      stroke-width="11" 
      stroke-linecap="round" 
      fill="none" 
    />
    <!-- Oliva Auricular Direita (Azul Escuro #073D70) -->
    <circle cx="137" cy="67" r="7.5" fill="#073D70" />

    <!-- Tubo Inferior em 'U' (Azul Claro #4099D0) -->
    <path 
      d="M 126 160 
         C 126 198, 150 220, 182 220 
         C 216 220, 226 195, 216 172" 
      stroke="#4099D0" 
      stroke-width="12" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Diafragma / Campânula (Azul Escuro #073D70 com Miolo Branco #FFFFFF) -->
    <circle cx="212" cy="166" r="17" fill="#073D70" />
    <circle cx="212" cy="166" r="8.5" fill="#FFFFFF" />
  </g>

  <!-- ================= TEXTO DO LOGOTIPO ================= -->
  <!-- "Doutivida" -->
  <text x="246" y="142" class="font-doutivida" font-size="88" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#073D70">Douti</tspan>
    <tspan fill="#4099D0">vida</tspan>
  </text>

  <!-- Tagline: "SAÚDE MAIS PERTO DE VOCÊ" -->
  <text 
    x="248" 
    y="185" 
    class="font-doutivida" 
    font-size="15" 
    font-weight="600" 
    letter-spacing="12.5" 
    fill="#073D70"
  >
    SAÚDE MAIS PERTO DE VOCÊ
  </text>
</svg>
